name: M4.3 integrate

on:
  push:
    branches: [main]
    paths:
      - scripts/m43_integrate.py
      - .github/workflows/m43-integrate.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
      - name: Apply integration
        run: |
          python3 scripts/m43_integrate.py
          gofmt -w main.go m3.go m43_export.go
          go test ./...
          go vet ./...
      - name: Commit integration
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add main.go m3.go README.md
          git commit -m 'Integrate M4.3 export routes and docs'
          git push origin HEAD:main
