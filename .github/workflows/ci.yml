name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  packages: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
      - name: Verify module files
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
      - run: go test ./...
      - name: Live GHCR collector smoke test
        env:
          GHCR_LIVE_TEST: '1'
        run: go test -run TestGitHubHTMLCollectorLive -v .
      - name: Live GHCR package discovery
        env:
          GHCR_STATS_DISCOVERY_TOKEN: ${{ secrets.GHCR_STATS_DISCOVERY_TOKEN }}
        run: |
          if [ -z "$GHCR_STATS_DISCOVERY_TOKEN" ]; then
            echo "::notice::Skipping live package discovery; GHCR_STATS_DISCOVERY_TOKEN is not configured"
            exit 0
          fi
          GHCR_LIVE_DISCOVERY_TEST=1 \
          GHCR_STATS_GITHUB_TOKEN="$GHCR_STATS_DISCOVERY_TOKEN" \
            go test -run TestGitHubPackagesDiscovererLive -v .
      - run: go vet ./...
      - run: docker compose config --quiet
      - run: docker build --build-arg VERSION=ci --build-arg REVISION="$GITHUB_SHA" -t ghcr-stats:ci .
      - name: Verify non-root and OCI metadata
        run: |
          test "$(docker run --rm --entrypoint id ghcr-stats:ci -u)" = "1000"
          test "$(docker image inspect ghcr-stats:ci --format '{{ index .Config.Labels "org.opencontainers.image.version" }}')" = "ci"
          test "$(docker image inspect ghcr-stats:ci --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')" = "$GITHUB_SHA"
      - name: Runtime API and badge qualification
        run: |
          set -euxo pipefail
          docker volume create ghcr-stats-ci-data
          docker run -d --name ghcr-stats-ci \
            -p 18080:8080 \
            -e GHCR_STATS_OWNER=Ploos-AS \
            -e GHCR_STATS_PACKAGES=soju \
            -e GHCR_STATS_INTERVAL=1h \
            -v ghcr-stats-ci-data:/data \
            ghcr-stats:ci
          trap 'docker logs ghcr-stats-ci || true; docker rm -f ghcr-stats-ci || true; docker volume rm ghcr-stats-ci-data || true' EXIT

          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18080/healthz | grep -qx ok; then
              break
            fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:18080/healthz | grep -qx ok

          curl -fsS http://127.0.0.1:18080/version > /tmp/version.json
          python3 - <<'PY'
          import json, os
          data = json.load(open('/tmp/version.json'))
          assert data['version'] == 'ci', data
          assert data['revision'] == os.environ['GITHUB_SHA'], data
          PY

          for i in $(seq 1 15); do
            status=$(docker inspect ghcr-stats-ci --format '{{if .State.Health}}{{.State.Health.Status}}{{end}}')
            if [ "$status" = healthy ]; then
              break
            fi
            sleep 1
          done
          test "$(docker inspect ghcr-stats-ci --format '{{.State.Health.Status}}')" = "healthy"

          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18080/api/v1/packages/soju > /tmp/soju.json; then
              break
            fi
            sleep 1
          done
          grep -q '"package":"soju"' /tmp/soju.json
          grep -Eq '"downloads":[0-9]+' /tmp/soju.json

          curl -fsS http://127.0.0.1:18080/api/v1/packages > /tmp/packages.json
          grep -q '"source":"explicit"' /tmp/packages.json
          grep -q '"soju"' /tmp/packages.json

          curl -fsS http://127.0.0.1:18080/badge/soju/pulls.svg > /tmp/soju.svg
          grep -q '<svg' /tmp/soju.svg
          grep -q 'GHCR pulls' /tmp/soju.svg

          curl -fsS http://127.0.0.1:18080/api/v1/badge/soju/pulls > /tmp/shields.json
          grep -q '"schemaVersion":1' /tmp/shields.json

          curl -fsS http://127.0.0.1:18080/api/v1/org > /tmp/org.json
          grep -Eq '"downloads":[0-9]+' /tmp/org.json
          grep -q '"package_source":"explicit"' /tmp/org.json

          curl -fsS http://127.0.0.1:18080/metrics > /tmp/metrics.txt
          grep -q 'ghcr_downloads_total' /tmp/metrics.txt
          grep -q 'ghcr_org_downloads_total' /tmp/metrics.txt
          grep -q 'ghcr_stats_packages' /tmp/metrics.txt
          grep -q 'ghcr_stats_discovery_up' /tmp/metrics.txt
      - name: Container restart persistence qualification
        run: |
          set -euxo pipefail
          volume=ghcr-stats-ci-restart-data
          container=ghcr-stats-ci-restart
          package=ghcr-stats-ci-definitely-missing-package

          docker volume create "$volume"
          trap 'docker logs "$container" || true; docker rm -f "$container" || true; docker volume rm "$volume" || true' EXIT

          start_container() {
            docker run -d --name "$container" \
              -p 18081:8080 \
              -e GHCR_STATS_OWNER=Ploos-AS \
              -e GHCR_STATS_PACKAGES="$package" \
              -e GHCR_STATS_INTERVAL=1h \
              -v "$volume":/data \
              ghcr-stats:ci
          }

          wait_for_failure_count() {
            expected="$1"
            for i in $(seq 1 30); do
              if curl -fsS "http://127.0.0.1:18081/api/v1/health?package=$package" > /tmp/restart-health.json; then
                count=$(python3 -c 'import json; print(json.load(open("/tmp/restart-health.json"))["total_failures"])')
                consecutive=$(python3 -c 'import json; print(json.load(open("/tmp/restart-health.json"))["consecutive_failures"])')
                if [ "$count" -ge "$expected" ] && [ "$consecutive" -ge "$expected" ]; then
                  return 0
                fi
              fi
              sleep 1
            done
            cat /tmp/restart-health.json || true
            return 1
          }

          start_container
          wait_for_failure_count 1
          first_total=$(python3 -c 'import json; print(json.load(open("/tmp/restart-health.json"))["total_failures"])')
          first_consecutive=$(python3 -c 'import json; print(json.load(open("/tmp/restart-health.json"))["consecutive_failures"])')
          test "$first_total" -eq 1
          test "$first_consecutive" -eq 1
          grep -q '"last_error"' /tmp/restart-health.json

          docker rm -f "$container"

          start_container
          wait_for_failure_count 2
          second_total=$(python3 -c 'import json; print(json.load(open("/tmp/restart-health.json"))["total_failures"])')
          second_consecutive=$(python3 -c 'import json; print(json.load(open("/tmp/restart-health.json"))["consecutive_failures"])')
          test "$second_total" -eq 2
          test "$second_consecutive" -eq 2
          grep -q '"last_error"' /tmp/restart-health.json

          curl -fsS http://127.0.0.1:18081/metrics > /tmp/restart-metrics.txt
          grep -Eq 'ghcr_stats_collection_errors_total.* 2$' /tmp/restart-metrics.txt
          grep -Eq 'ghcr_stats_consecutive_failures.* 2$' /tmp/restart-metrics.txt
