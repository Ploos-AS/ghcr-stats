name: M3.3 refactor

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/m33-refactor.yml'

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply M3.3 cleanup
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('m3.go')
          s = p.read_text()
          s = s.replace('\t"html/template"\n', '')
          start = s.index('var dashboardTemplate =')
          end = s.index('func (a *App) handleM3Index', start)
          p.write_text(s[:start] + s[end:])

          p = Path('main.go')
          s = p.read_text()
          s = s.replace('\t"regexp"\n', '')
          start = s.index('var downloadsPatterns =')
          end = s.index('func (c GitHubHTMLCollector) Collect', start)
          s = s[:start] + s[end:]
          start = s.index('\tfor _, re := range downloadsPatterns {', s.index('func (c GitHubHTMLCollector) Collect'))
          marker = '\treturn 0, errors.New("download count not found on GitHub package page")\n'
          end = s.index(marker, start) + len(marker)
          s = s[:start] + '\treturn parseDownloadCount(text)\n' + s[end:]
          old = 'if _, err = db.Exec(`CREATE TABLE IF NOT EXISTS snapshots (package TEXT NOT NULL, downloads INTEGER NOT NULL, collected_at TEXT NOT NULL); CREATE INDEX IF NOT EXISTS idx_snapshots_pkg_time ON snapshots(package, collected_at);`); err != nil {'
          new = 'if _, err = db.Exec(`CREATE TABLE IF NOT EXISTS snapshots (package TEXT NOT NULL, downloads INTEGER NOT NULL, collected_at TEXT NOT NULL); CREATE INDEX IF NOT EXISTS idx_snapshots_pkg_time ON snapshots(package, collected_at);` + collectionStateSchema); err != nil {'
          if old not in s:
              raise SystemExit('OpenStore schema block not found')
          p.write_text(s.replace(old, new, 1))

          p = Path('collector_harden.go')
          s = p.read_text()
          s = s.replace('var hardenedDownloadsPatterns', 'var downloadsPatterns')
          replacement = '''func parseDownloadCount(text string) (int64, error) {
          \tfor _, re := range downloadsPatterns {
          \t\tm := re.FindStringSubmatch(text)
          \t\tif len(m) != 2 {
          \t\t\tcontinue
          \t\t}
          \t\tn := strings.NewReplacer(",", "", ".", "", "_", "", " ", "").Replace(m[1])
          \t\tif v, err := strconv.ParseInt(n, 10, 64); err == nil {
          \t\t\treturn v, nil
          \t\t}
          \t}
          \treturn 0, errors.New("download count not found on GitHub package page")
          }
          '''
          s = re.sub(r'func init\(\) \{.*?\n\}', replacement, s, flags=re.S)
          s = s.replace('import "regexp"', 'import (\n\t"errors"\n\t"regexp"\n\t"strconv"\n\t"strings"\n)')
          p.write_text(s)

          p = Path('m24_store.go')
          s = p.read_text()
          s = re.sub(r'func \(s \*Store\) ensureCollectionState\(\) error \{.*?\n\}\n\n', '', s, count=1, flags=re.S)
          s = s.replace('\tif err := s.ensureCollectionState(); err != nil {\n\t\treturn err\n\t}\n', '', 1)
          s = s.replace('\tif err := s.ensureCollectionState(); err != nil {\n\t\treturn failureCounter{}, err\n\t}\n', '', 1)
          p.write_text(s)
          PY
          gofmt -w -- main.go m3.go collector_harden.go m24_store.go
          test -z "$(gofmt -l .)"
          go test ./...
          go vet ./...
      - name: Commit M3.3 cleanup
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add main.go m3.go collector_harden.go m24_store.go
          git commit -m 'Refactor M3 analytics collector and store internals'
          git push origin HEAD:main
