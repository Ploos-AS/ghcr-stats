name: M5.5 events UI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  events-ui:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)"
      - name: test
        run: go test ./...
      - name: vet
        run: go vet ./...
