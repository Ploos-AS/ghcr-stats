name: M3.2 patch

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/m32-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply M3.2 handler patch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('m32_dashboard.go')
          s = p.read_text()
          s = s.replace('"strings"\n)', '"strings"\n\t"time"\n)')
          p.write_text(s)

          p = Path('m3.go')
          s = p.read_text()
          start = s.index('func (a *App) handleM3Index')
          end = s.index('func limitRankings', start)
          replacement = '''func (a *App) handleM3Index(w http.ResponseWriter, r *http.Request) {
          \tperiod := normalizeDashboardPeriod(r.URL.Query().Get("period"))
          \tif r.URL.Path == "/" {
          \t\trankings, _ := a.rankings(period, time.Now().UTC())
          \t\tw.Header().Set("Content-Type", "text/html; charset=utf-8")
          \t\t_ = dashboardTemplateM32.Execute(w, map[string]any{
          \t\t\t"Owner": a.cfg.Owner,
          \t\t\t"Org": a.orgAnalytics(time.Now().UTC()),
          \t\t\t"Rankings": rankings,
          \t\t\t"Period": period,
          \t\t\t"Periods": dashboardPeriods(period),
          \t\t\t"OrgDegraded": orgDashboardDegraded(a),
          \t\t})
          \t\treturn
          \t}
          \tif strings.HasPrefix(r.URL.Path, "/package/") {
          \t\tpkg := strings.Trim(strings.TrimPrefix(r.URL.Path, "/package/"), "/")
          \t\tif !validPackagePath(pkg) {
          \t\t\thttp.NotFound(w, r)
          \t\t\treturn
          \t\t}
          \t\ts, err := a.analyticsSummary(pkg, time.Now().UTC())
          \t\tif err != nil {
          \t\t\thttp.NotFound(w, r)
          \t\t\treturn
          \t\t}
          \t\tw.Header().Set("Content-Type", "text/html; charset=utf-8")
          \t\t_ = packageTemplateM32.Execute(w, map[string]any{
          \t\t\t"Summary": s,
          \t\t\t"Health": a.collectorHealth(pkg, time.Now().UTC()),
          \t\t\t"Period": period,
          \t\t\t"Periods": dashboardPeriods(period),
          \t\t})
          \t\treturn
          \t}
          \thttp.NotFound(w, r)
          }

          '''
          p.write_text(s[:start] + replacement + s[end:])
          PY
          gofmt -w -- m3.go m32_dashboard.go m32_dashboard_test.go
          go test ./...
      - name: Commit M3.2 patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add m3.go m32_dashboard.go m32_dashboard_test.go
          git commit -m 'Polish M3 dashboard and period controls'
          git push origin HEAD:main
