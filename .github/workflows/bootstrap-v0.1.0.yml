name: Bootstrap v0.1.0

on:
  push:
    branches: [main]

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write

env:
  RELEASE_SHA: 0c3995349435812d814e6fe571d52414f4ab0830
  IMAGE: ghcr.io/ploos-as/ghcr-stats

jobs:
  release:
    if: contains(github.event.head_commit.message, '[release-v0.1.0]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_SHA }}
          fetch-depth: 0

      - name: Verify qualified commit
        run: test "$(git rev-parse HEAD)" = "$RELEASE_SHA"

      - name: Create v0.1.0 tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git tag v0.1.0 "$RELEASE_SHA"
          git push origin v0.1.0

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:0.1.0
            ${{ env.IMAGE }}:0.1
            ${{ env.IMAGE }}:0
            ${{ env.IMAGE }}:latest
          labels: |
            org.opencontainers.image.title=ghcr-stats
            org.opencontainers.image.version=0.1.0
            org.opencontainers.image.revision=${{ env.RELEASE_SHA }}
            org.opencontainers.image.source=https://github.com/Ploos-AS/ghcr-stats
          build-args: |
            VERSION=v0.1.0
            REVISION=${{ env.RELEASE_SHA }}
          provenance: mode=max
          sbom: true

      - uses: actions/attest-build-provenance@v3
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create v0.1.0 --verify-tag --generate-notes --title "ghcr-stats v0.1.0" --target "$RELEASE_SHA"
