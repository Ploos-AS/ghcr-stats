services:
  ghcr-stats:
    image: ghcr.io/ploos-as/ghcr-stats:latest
    container_name: ghcr-stats
    restart: unless-stopped
    user: "1000:1000"
    stop_grace_period: 30s
    pids_limit: 128
    ports:
      - "8080:8080"
    environment:
      GHCR_STATS_OWNER: ${GHCR_STATS_OWNER:-Ploos-AS}
      GHCR_STATS_INTERVAL: ${GHCR_STATS_INTERVAL:-6h}
      GHCR_STATS_PACKAGES: ${GHCR_STATS_PACKAGES:-}
      GHCR_STATS_GITHUB_TOKEN: ${GHCR_STATS_GITHUB_TOKEN:-}
      GHCR_STATS_GITHUB_TOKEN_FILE: ${GHCR_STATS_GITHUB_TOKEN_FILE:-}
      GHCR_STATS_DB: ${GHCR_STATS_DB:-/data/ghcr-stats.db}
      GHCR_STATS_LISTEN: ${GHCR_STATS_LISTEN:-:8080}
    volumes:
      - ./data:/data
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
